id: CTT - Hygiene - Ask Owner
version: -1
name: CTT - Hygiene - Ask Owner
description: 'Sub-playbook of CTT - Hygiene - Notify Owner, one round per run (the parent repeats it until the answer closes the issue): asks the owner "Did you fix it?" by Generated link and sends the Slack DM with the answers as buttons (Mark as Fixed / Mark as False Positive / View Issue). From the second round on, the DM starts with what the check still saw (CTT.Reask.note). Mark as Fixed runs the fix check; Mark as False Positive records it and tells the CTT channel. Writes the result to CTT.FixCheck (close, reason, note); the parent closes the issue. Runs in the parent''s context.'

id: CTT - Marketplace Updates
version: -1
name: CTT - Marketplace Updates
description: 'Jev-reviewed Marketplace updates: collects newer pack releases, has TypeSafe Jev review each one against the enabled integrations, installs approved updates with their mandatory dependencies and verifies the versions. Held, unresolved or failed updates get one deduplicated review case each, breaking changes that affect an enabled integration get a validation issue, and a summary goes to the CTT Slack channel. Run by the job of the same name (Monday to Thursday, 05:00 Singapore time). Needs the Core REST API integration and a TypeSafe Jev instance; without Jev the run closes without changes.'
fromversion: 8.9.0
marketplaces:
- marketplacev2
- platform
tags:
- CTT

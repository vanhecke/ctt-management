commonfields:
  id: CTTHygieneSendDM
  version: -1
name: CTTHygieneSendDM
comment: Sends the CTT hygiene DM to an owner through the CTT Slack Webhook integration (action msg_person). Lays it out for the code block the CTT workflow shows (header box with the guideline, the AI-written message or the triage template wrapped to 46 characters, footer with the issue link), and counts DMs per owner per day in the "CTT - Notify State" list for the daily limit.
script: '-'
type: python
subtype: python3
dockerimage: demisto/python3:3.12.15.14069087
runas: DBotWeakRole
enabled: true
tags:
- CTT
args:
- name: slack_user_id
  required: true
  description: The owner's Slack member ID.
- name: owner_email
  required: true
  description: The owner's email (for the daily DM count).
- name: first_name
  description: The owner's first name (template greeting).
- name: found
  description: The FOUND sentence from CTTHygieneTriage.
- name: fix
  description: The FIX steps from CTTHygieneTriage, one per line.
- name: guideline_title
  description: The guideline's one-line rule.
- name: message
  description: Optional AI-written message (CTT.HygieneMessage); used instead of the template when complete.
- name: issue_url
  description: The issue link, shown in the footer (and sent as the url key when the instance allows).
- name: issue_id
  description: The issue ID, shown in the footer.
- name: guideline_id
  description: The guideline ID, shown in the header box.
- name: note
  description: A note shown above the message, for example what is still wrong after the owner said it was fixed.
- name: fixed_url
  description: Link that answers "Fixed" on the issue's question (from CTTHygieneAskLinks).
- name: not_violation_url
  description: Link that answers "False positive" on the issue's question.
- name: buttons
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  description: true sends the links as Slack buttons (webhook action msg_person_health_issue, notify.buttons in CTT - Config); false lists them in the text.
- name: closed
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "false"
  description: true sends the thank-you DM for a closed issue (close_reason, close_note) instead of the question. It doesn't count toward the daily DM limit.
- name: close_reason
  description: The close reason (with closed=true); a false positive gets its own thank-you.
- name: close_note
  description: The close note, quoted in the thank-you (with closed=true).
- name: content
  description: Text that is already laid out for the code block (for example the case housekeeping digest). Sent as is instead of the template or AI message.
outputs:
- contextPath: CTT.DM.content
  description: The message that was sent.
  type: String
dependson:
  must:
  - ctt-slack-webhook-send
fromversion: 8.9.0
marketplaces:
- marketplacev2
- platform
tests:
- No tests (auto formatted)

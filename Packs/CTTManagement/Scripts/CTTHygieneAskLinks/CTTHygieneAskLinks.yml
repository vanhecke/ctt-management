commonfields:
  id: CTTHygieneAskLinks
  version: -1
name: CTTHygieneAskLinks
comment: Waits until the "Did you fix it?" question of the CTT - Hygiene - Notify Owner playbook has written its answer links (Ask by Generated link) and returns the newest link per answer, for the Mark as Fixed and Mark as False Positive buttons of the owner's Slack DM.
script: '-'
type: python
subtype: python3
dockerimage: demisto/python3:3.12.15.14069087
runas: DBotWeakRole
enabled: true
tags:
- CTT
args:
- name: task_id
  required: true
  description: ID of the Ask task in the playbook.
- name: timeout
  defaultValue: "90"
  description: Seconds to wait for the links.
outputs:
- contextPath: CTT.Ask.issue_id
  description: The issue (investigation) ID.
  type: String
- contextPath: CTT.Ask.fixed_url
  description: Link that answers "Fixed".
  type: String
- contextPath: CTT.Ask.not_violation_url
  description: Link that answers "False positive".
  type: String
dependson:
  must:
  - core-api-post
fromversion: 8.9.0
marketplaces:
- marketplacev2
- platform
tests:
- No tests (auto formatted)

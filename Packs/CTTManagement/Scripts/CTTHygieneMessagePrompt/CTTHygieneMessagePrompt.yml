commonfields:
  id: CTTHygieneMessagePrompt
  version: -1
name: CTTHygieneMessagePrompt
comment: Prompt-backed (isllm) step of the CTT - Hygiene - Notify Owner playbook. Writes the short, friendly Slack DM that tells a DC what the CTT monitoring found, which guideline it concerns and how to fix it, ending with the issue link.
type: python
isllm: true
userprompt: |-
  Write the body of a Slack direct message to ${first_name} about something the monitoring of the shared Cortex Team Tenant (CTT) found. A header with the guideline ID and a footer with the issue link are added around your text, so leave both out.

  What was found: ${issue_title}
  Details: ${issue_details}
  Guideline ${guideline_id}: ${guideline_title}
  What the guideline says: ${guideline_text}
  ${first_name}'s tags: ${owner_tags}

  Write exactly this shape, plain text only:

  Hi ${first_name},

  <one or two sentences on what was found; quote object names exactly as given, in double quotes>

  Fix:
  • <the concrete fix; for a rename, give the new name with their first tag, for example "<tag> - <current name>">
  • <a second step only if it really helps>

  If this was intended, reply in the CTT channel.

  Rules: friendly and matter-of-fact, no blame, no exclamation marks, no emoji, no links, no Markdown (asterisks, underscores, backticks, headings). At most 70 words. Output only the message.
promptConfig:
  modelTier: Flash
  systemInstruction: >-
    You write brief, friendly Slack messages on behalf of the CTT admins of a shared Cortex XSIAM
    tenant used by a team of Domain Consultants. You use only the facts you are given: never invent
    object names, guidelines, deadlines or consequences, and never threaten. If the details are thin,
    keep the message general rather than guessing.
  # Flash reasons before it answers and the reasoning counts against this limit; 1024 cut the
  # message off mid-sentence.
  maxOutputTokens: 8192
  webSearch: false
args:
- name: first_name
  description: The owner's first name.
  required: true
- name: issue_title
  description: What was found.
  required: true
- name: issue_details
  description: The issue description.
  required: false
- name: owner_tags
  description: The owner's tags, primary first.
  required: false
- name: guideline_id
  description: Guideline ID, for example CTT-TAG-01.
  required: true
- name: guideline_title
  description: The guideline's one-line rule.
  required: false
- name: guideline_text
  description: The guideline's full text.
  required: false
outputs:
- contextPath: CTT.HygieneMessage
  description: The Slack message for the owner.
  type: String
fromversion: 8.15.0
tags:
- CTT
marketplaces:
- platform

commonfields:
  id: CTTHygieneDispatch
  version: -1
name: CTTHygieneDispatch
comment: Starts the CTT - Hygiene - Notify Owner playbook on new, unassigned CTT hygiene issues (Health domain, status New, name starting "CTT - Hygiene - "). Run every 15 minutes by the CTT - Hygiene - Notify Dispatcher job, because pack uploads to XSIAM 8.15 do not install automation rules (triggers). Issues that already run a playbook are skipped; dispatched issue IDs are kept in the "CTT - Dispatch State" list.
script: '-'
type: python
subtype: python3
dockerimage: demisto/python3:3.12.15.14069087
runas: DBotWeakRole
enabled: true
tags:
- CTT
args:
- name: lookback_hours
  description: How far back to look for new hygiene issues (default 48).
- name: max_per_run
  description: The most issues to dispatch in one run (default 20).
outputs:
- contextPath: CTT.Dispatch.Issue
  description: Issue ID.
  type: String
- contextPath: CTT.Dispatch.Action
  description: What was done with the issue.
  type: String
dependson:
  must:
  - core-api-post
  - core-api-get
fromversion: 8.9.0
marketplaces:
- marketplacev2
- platform
tests:
- No tests (auto formatted)

commonfields:
  id: CTTHygieneSweep
  version: -1
name: CTTHygieneSweep
comment: Daily CTT hygiene sweep. Inventories custom playbooks, scripts, jobs, integration instances, correlation rules and lookup datasets, plus open Security cases, and raises one Medium health issue per guideline and owner (CTT-TAG-01, CTT-TAG-02, CTT-LIFE-02, CTT-CASE-01). Tracks raised issues in the "CTT - Sweep State" list and replaces its issue when new items appear and resolves it once the findings clear. Never changes the objects it checks.
script: '-'
type: python
subtype: python3
dockerimage: demisto/python3:3.12.15.14069087
runas: DBotWeakRole
enabled: true
tags:
- CTT
args:
- name: dry_run
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "false"
  description: Report findings without raising or resolving issues.
- name: include_inventory
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "false"
  description: Also return every inspected object with its tag and owner (CTT.Sweep.Inventory).
- name: stale_case_days
  description: Days without change after which an open Security case counts as stale. Defaults to sweep.stale_case_days in "CTT - Config".
outputs:
- contextPath: CTT.Sweep.Findings
  description: One entry per finding (kind, name, guideline, owner, detail).
  type: Unknown
- contextPath: CTT.Sweep.Inventory
  description: With include_inventory, every inspected object (kind, name, tag, owner).
  type: Unknown
- contextPath: CTT.Sweep.Raised
  description: Guideline|owner keys that got a new issue.
  type: Unknown
- contextPath: CTT.Sweep.Resolved
  description: Guideline|owner keys whose previous issue was resolved.
  type: Unknown
- contextPath: CTT.Sweep.Errors
  description: Collection errors (an object type that could not be read).
  type: Unknown
dependson:
  must:
  - core-api-post
fromversion: 8.9.0
marketplaces:
- marketplacev2
- platform
tests:
- No tests (auto formatted)

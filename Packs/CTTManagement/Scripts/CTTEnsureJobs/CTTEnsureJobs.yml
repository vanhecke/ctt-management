commonfields:
  id: CTTEnsureJobs
  version: -1
name: CTTEnsureJobs
comment: Creates or updates the CTT jobs from the "CTT - Jobs" list, and repairs jobs whose runs the scheduler drops (no category, parent or owner). Run it once after installing or upgrading the pack; uploads of a pack to XSIAM 8.15 skip the Jobs folder.
script: '-'
type: python
subtype: python3
dockerimage: demisto/python3:3.12.15.14069087
runas: DBotWeakRole
enabled: true
tags:
- CTT
args:
- name: dry_run
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "false"
  description: Show what would be created or updated without changing anything.
- name: remove_obsolete
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "false"
  description: Also delete jobs named "CTT - ..." that the list no longer defines (for example CTT - Weekly Stats after 1.1.0). Without it they are only reported as obsolete.
- name: owner
  description: Email of the user the jobs run as (a CTT admin). Existing jobs keep their owner; new jobs and jobs without one get this, or the user running the script when empty.
outputs:
- contextPath: CTT.Jobs.Job
  description: Job name.
  type: String
- contextPath: CTT.Jobs.Action
  description: create, update, ok, obsolete or deleted.
  type: String
- contextPath: CTT.Jobs.Changed
  description: Fields that differed on the tenant.
  type: String
- contextPath: CTT.Jobs.Owner
  description: The user the job runs as.
  type: String
dependson:
  must:
  - core-api-post
  - core-api-delete
fromversion: 8.9.0
marketplaces:
- marketplacev2
- platform
tests:
- No tests (auto formatted)

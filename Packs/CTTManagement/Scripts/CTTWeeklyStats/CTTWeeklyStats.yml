commonfields:
  id: CTTWeeklyStats
  version: -1
name: CTTWeeklyStats
comment: Builds a weekly tenant statistics summary (cases, issues, playbook runs, top scripts, data ingested, XQL compute, sign-ins, most active builders, endpoints, AI agent use, hygiene issues) and posts it to the team Slack channel from the "CTT - Config" list (stats.slack_channel) through SlackV3. Without a channel it only writes the summary to the War Room.
script: '-'
type: python
subtype: python3
dockerimage: demisto/python3:3.12.15.14069087
runas: DBotWeakRole
enabled: true
timeout: 900ns
tags:
- CTT
args:
- name: period_days
  description: Days to report on. Defaults to stats.period_days in "CTT - Config" (7).
- name: channel
  description: Slack channel to post to. Defaults to stats.slack_channel in "CTT - Config".
- name: send
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  defaultValue: "true"
  description: Set to false to only show the summary in the War Room.
outputs:
- contextPath: CTT.WeeklyStats.message
  description: The summary in Slack mrkdwn.
  type: String
- contextPath: CTT.WeeklyStats.errors
  description: Parts of the summary that could not be collected.
  type: Unknown
dependson:
  must:
  - core-api-post
  should:
  - send-notification
fromversion: 8.9.0
marketplaces:
- marketplacev2
- platform
tests:
- No tests (auto formatted)

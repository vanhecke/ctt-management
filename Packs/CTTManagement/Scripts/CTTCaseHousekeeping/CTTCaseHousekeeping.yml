commonfields:
  id: CTTCaseHousekeeping
  version: -1
name: CTTCaseHousekeeping
comment: Keeps open Security cases tidy (CTT-CASE-01, CTT-CASE-02). Assigns cases that have been unassigned for a day to their owner (the tag of the correlation rule behind their issues, the owner of an endpoint in the case, or the lab range of a 10.x or 172.16.x address), suggests closing cases without new issues for a day, and resolves cases open for 7 days as Security Testing. Starred cases are left alone. Owners get one Slack DM per run. Settings come from the cases block in "CTT - Config"; actions taken are remembered in the "CTT - Case State" list.
script: '-'
type: python
subtype: python3
dockerimage: demisto/python3:3.12.15.14069087
runas: DBotWeakRole
enabled: true
timeout: 900ns
tags:
- CTT
args:
- name: dry_run
  auto: PREDEFINED
  predefined:
  - "true"
  - "false"
  description: true only reports what would change (no updates, no DMs). Defaults to cases.dry_run in "CTT - Config".
outputs:
- contextPath: CTT.CaseHousekeeping.Closed
  description: Cases resolved as Security Testing.
  type: Number
- contextPath: CTT.CaseHousekeeping.Assigned
  description: Cases assigned to their owner.
  type: Number
- contextPath: CTT.CaseHousekeeping.Suggested
  description: Cases whose owner was asked to close them.
  type: Number
- contextPath: CTT.CaseHousekeeping.NoOwner
  description: Cases to assign for which no owner was found.
  type: Number
dependson:
  must:
  - core-api-post
fromversion: 8.9.0
marketplaces:
- marketplacev2
- platform
tests:
- No tests (auto formatted)

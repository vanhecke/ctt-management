global_rule_id: b69d2f67-e043-5fb9-ab11-913348bc519e
name: CTT - Hygiene - API key created without expiry
description: Someone created an API key with no expiration date (CTT-CEN-02, proposed guideline; ships disabled).
fromversion: 8.9.0
is_enabled: false
dataset: alerts
execution_mode: SCHEDULED
crontab: '*/30 * * * *'
search_window: 35 minutes
timezone: UTC
xql_query: |
  dataset = management_auditing
  | filter management_auditing_type = ENUM.MANAGEMENT_AUDIT_API_KEY and subtype = "Add New Key" and description contains "Expiration UTC Time: Not specified"
  | filter management_auditing_result = ENUM.MANAGEMENT_AUDIT_SUCCESS and email != null and email not in ("Palo Alto Networks", "N/A")
  | alter actor_email = if(email contains "@", lowercase(email), null), actor_name = lowercase(user_name)
  | join type = left (dataset = ctt_registry | filter owner_email != "" | alter is_adm = if(role = "admin", 1, 0) | comp max(is_adm) as reg_actor_admin by owner_email | alter reg_actor_email = owner_email | fields reg_actor_email, reg_actor_admin) as ra ra.reg_actor_email = actor_email
  | join type = left (dataset = ctt_registry | filter owner_email != "" | alter is_adm = if(role = "admin", 1, 0), reg_name_key = lowercase(owner_name) | comp max(is_adm) as reg_name_admin, max(owner_email) as reg_name_email by reg_name_key | fields reg_name_key, reg_name_admin, reg_name_email) as rn rn.reg_name_key = actor_name
  | alter actor = coalesce(reg_actor_email, reg_name_email, actor_email, actor_name), actor_is_admin = coalesce(reg_actor_admin, reg_name_admin, 0), actor_registered = if(coalesce(reg_actor_email, reg_name_email) != null, "yes", "no")
  | alter guideline_id = "CTT-CEN-02", title = "API key created without expiry", finding = description
  | fields _time, actor, actor_email, finding, guideline_id, title, description
action: ALERTS
alert_domain: DOMAIN_HEALTH
alert_type: Unclassified
alert_category: OTHER
alert_name: CTT - Hygiene - $guideline_id - $title
alert_description: '$actor created an API key without an expiration date: $finding (guideline $guideline_id).'
alert_fields:
  actor_effective_username: actor
severity: SEV_030_MEDIUM
user_defined_severity: null
user_defined_category: null
mapping_strategy: CUSTOM
mitre_defs: {}
suppression_enabled: true
suppression_duration: 1 days
suppression_fields:
- actor
- description
investigation_query_link: dataset = management_auditing | filter email = "$actor_email" or lowercase(user_name) = "$actor" | sort desc _time
drilldown_query_timeframe: ALERT
lookup_mapping: []

commonfields:
  id: ctt-hygiene-skill
  version: -1
name: CTT Hygiene
description: >-
  Shows a DC what they own on the shared tenant and what breaks the CTT guidelines, and explains
  CTT hygiene issues. Use it when someone asks what they own, whether their content is compliant,
  why a CTT - Hygiene health issue was raised, which hygiene issues are open for them, or how to fix
  an untagged playbook, script, job, integration instance, correlation rule or lookup. It reports and
  explains only; the user fixes their own objects.
